schema: spec-driven

context: |
  Argos: self-hosted HTTP API that exposes the Laya decision engine (pip `laya`,
  https://laya.convaiinnovations.com/) for typed decisions (choice / score / yes-no) over text.
  API public at argos-api.northernarchive.com; web wizard (web/, Vite + React 19 static build
  on nginx, Spanish UI) at argos.northernarchive.com, calling the API cross-origin (CORS).
  Host: void-server, Raspberry Pi 4B arm64, 4 cores, 7.7 GB RAM, no GPU, shared with ~15
  containers. Ingress/TLS/DNS conventions live in the pasta0126/infra repo (Traefik v3.7,
  external `proxy` network, Let's Encrypt HTTP challenge, DNS records added by hand in cdmon).
  Stack: Python 3.12, FastAPI + uvicorn on :8080, Docker Compose per app, secrets in
  git-ignored .env (no `$` in values). Mirrors kaizen/server and nurk/server.
  The user plans and discusses in Spanish.

