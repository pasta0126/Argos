name: argos-api

services:
  argos-api:
    build: .
    image: argos-api:latest
    container_name: argos-api
    restart: unless-stopped
    env_file: .env
    mem_limit: 3g
    volumes:
      - argos-hf-cache:/data/hf
    networks:
      - proxy
    # Hosts and Traefik names come from .env (Compose reads it for ${...} interpolation).
    labels:
      - traefik.enable=true
      - traefik.http.routers.argos-api.rule=Host(`${ARGOS_API_HOST:?set ARGOS_API_HOST in .env}`)
      - traefik.http.routers.argos-api.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.argos-api.tls.certresolver=${TRAEFIK_CERTRESOLVER:-le}
      - traefik.http.services.argos-api.loadbalancer.server.port=8080

volumes:
  argos-hf-cache:

networks:
  proxy:
    external: true
    name: ${TRAEFIK_NETWORK:-proxy}
