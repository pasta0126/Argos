# Included in every location: add_header in a location drops the server-level ones.
add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https://argos-api.northernarchive.com; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Content-Type-Options "nosniff" always;
