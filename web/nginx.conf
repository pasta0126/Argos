server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # The API moved to argos-api.northernarchive.com. 308 keeps method and body; note that
  # `curl -L` drops Authorization when the host changes, so scripts must update the URL.
  location ^~ /v1/          { return 308 https://argos-api.northernarchive.com$request_uri; }
  location = /health        { return 308 https://argos-api.northernarchive.com$request_uri; }
  location ^~ /docs         { return 308 https://argos-api.northernarchive.com$request_uri; }
  location ^~ /redoc        { return 308 https://argos-api.northernarchive.com$request_uri; }
  location = /openapi.json  { return 308 https://argos-api.northernarchive.com$request_uri; }

  # Hashed file names: cache forever.
  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
