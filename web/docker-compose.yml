name: argos-web

services:
  argos-web:
    build: .
    image: argos-web:latest
    container_name: argos-web
    restart: unless-stopped
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.argos-web.rule=Host(`argos.northernarchive.com`)"
      - "traefik.http.routers.argos-web.entrypoints=websecure"
      - "traefik.http.routers.argos-web.tls.certresolver=le"
      - "traefik.http.services.argos-web.loadbalancer.server.port=80"

networks:
  proxy:
    external: true
